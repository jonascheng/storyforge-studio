[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "storyforge-studio"
version = "0.1.0"
description = "將文字故事轉換為具備情緒、角色演繹與生動聲音的有聲書電腦軟體"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Jonas Cheng" }
]
dependencies = [
    "google-genai>=0.1.0",
    "pywebview>=5.0.0",
    "pydub>=0.25.1",
    "static-ffmpeg>=2.5",
    "audioop-lts>=0.2.1; python_version >= '3.13'",
    "pyobjc-framework-webkit>=10.0; sys_platform == 'darwin'",
    "pythonnet>=3.0.0; sys_platform == 'win32'",
]


[dependency-groups]
dev = [
    "pytest>=8.0.0",
]


[project.scripts]
storyforge = "main:main"
storyforge-studio = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["core", "infrastructure", "ui"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"

