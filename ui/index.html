<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoryForge</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="glass-panel main-header">
            <div class="logo">
                <span class="logo-icon">✨</span>
                <h1>StoryForge</h1>
            </div>
            <div class="settings-btn" id="btnSettings">⚙️ 設定</div>
        </header>

        <div class="scroll-area" id="mainScrollArea">
            <main class="main-content">
                <!-- Step 1: 貼上故事想法 -->
            <div class="card editor-card" id="step1Section">
                <h2>1. 輸入故事想法</h2>
                <textarea id="storyInput" placeholder="例如：一個關於會說話的貓和失憶魔法師的冒險故事..."></textarea>
                <div class="story-name-row" style="display: none;">
                    <label for="storyNameInput">故事名稱</label>
                    <input type="text" id="storyNameInput" placeholder="AI 將自動產生，或手動輸入">
                </div>
                <div class="action-row" style="display: flex; gap: 10px; margin-top: 15px;">
                    <button class="primary-btn" id="btnExpandStory">
                        <span class="btn-text">✍️ AI 撰寫劇本</span>
                        <span class="btn-loader hidden">撰寫中...</span>
                    </button>
                    <button class="secondary-btn" id="btnLoadScreenplay" title="若之前已分析過，可直接載入進度">
                        <span class="btn-text">📂 載入舊劇本</span>
                        <span class="btn-loader hidden">讀取中...</span>
                    </button>
                </div>
            </div>

            <!-- Step 2: 故事劇本編輯區 (Story Script) -->
            <div class="card hidden" id="storyScriptSection">
                <div class="scenes-header">
                    <h2>2. 故事劇本確認</h2>
                    <span class="story-name-badge" id="storyScriptTitleBadge"></span>
                </div>
                
                <div style="margin-top: 15px;">
                    <div class="textarea-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                        <label style="font-weight: bold;">故事內容</label>
                        <button class="scene-regen-btn btn-zoom" data-target="storyScriptText" data-title="故事內容" title="全螢幕編輯">🔍 放大</button>
                    </div>
                    <textarea id="storyScriptText" class="editor-textarea" style="min-height: 200px; margin-bottom: 15px;"></textarea>
                    
                    <div class="textarea-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                        <label style="font-weight: bold;">角色設定</label>
                        <button class="scene-regen-btn" id="btnAddCharacter" title="新增角色">➕ 新增角色</button>
                    </div>
                    <div id="charactersContainer" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px;"></div>
                    
                    <div class="textarea-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                        <label style="font-weight: bold;">世界觀規則</label>
                        <button class="scene-regen-btn btn-zoom" data-target="storyScriptWorldview" data-title="世界觀規則" title="全螢幕編輯">🔍 放大</button>
                    </div>
                    <textarea id="storyScriptWorldview" class="editor-textarea" style="min-height: 80px; margin-bottom: 15px;"></textarea>
                </div>

                <div class="tweak-row" style="display: flex; gap: 10px; margin-bottom: 20px; align-items: center; background: rgba(0,0,0,0.05); padding: 10px; border-radius: 8px;">
                    <input type="text" id="tweakInput" placeholder="例如：讓結局更感人、加入一個反派角色..." style="flex: 1; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;">
                    <button class="secondary-btn" id="btnTweakStory">
                        <span class="btn-text">✨ 讓 AI 重寫</span>
                        <span class="btn-loader hidden">重寫中...</span>
                    </button>
                    <button class="secondary-btn" id="btnUndoTweak" title="復原至上一個版本" disabled>
                        <span>↩️ 復原</span>
                    </button>
                </div>

                <div class="final-actions" style="border-top: 1px solid var(--border-color); padding-top: 15px;">
                    <button class="primary-btn pulse" id="btnBreakdown">
                        <span class="btn-text">🎬 確認劇本，產生廣播劇</span>
                        <span class="btn-loader hidden">分析中...</span>
                    </button>
                </div>
            </div>

            <!-- Step 3: 場景編輯區 -->
            <div class="card scenes-card hidden" id="scenesSection">
                <div class="scenes-header">
                    <h2>3. 廣播劇本編輯區</h2>
                    <span class="story-name-badge" id="storyNameBadge"></span>
                </div>
                <div class="scenes-list" id="scenesList">
                    <!-- Scene cards injected here -->
                </div>
                <div class="final-actions">
                    <button class="primary-btn pulse" id="btnMixFinal">
                        <span class="btn-text">🔊 產出完整有聲書</span>
                        <span class="btn-loader hidden">合併中...</span>
                    </button>
                </div>
            </div>
        </main>
        </div>
    </div>

    <!-- Story Selector Modal -->
    <div class="modal hidden" id="storySelectorModal">
        <div class="modal-content glass-panel story-selector-modal">
            <div class="story-selector-header">
                <h2>📂 載入既有故事</h2>
                <p>請點選要繼續製作的故事，或直接從電腦中瀏覽選取資料夾。</p>
            </div>
            <div class="story-list-container" id="storyListContainer">
                <!-- Story items injected here -->
            </div>
            <div class="modal-actions story-selector-actions">
                <button class="secondary-btn" id="btnBrowseFolder">
                    <span>📁 從電腦資料夾瀏覽...</span>
                </button>
                <button class="secondary-btn" id="btnCloseStorySelector">關閉</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal hidden" id="settingsModal">
        <div class="modal-content glass-panel">
            <h2>一般設定</h2>
            <p>請輸入您的 Gemini API 通行證，我們會幫您記住。</p>
            <input type="password" id="apiKeyInput" placeholder="AIzaSy...">
            <div style="margin-top: 15px;">
                <label for="thinkingLevelSelect">思考深度 (Thinking Level)</label>
                <select id="thinkingLevelSelect" style="width: 100%; padding: 8px; margin-top: 5px; border-radius: 4px; border: 1px solid #ccc; background: rgba(255, 255, 255, 0.9);">
                    <option value="MEDIUM">MEDIUM (預設)</option>
                    <option value="LOW">LOW (較快但較淺)</option>
                </select>
            </div>
            <div style="margin-top: 15px;">
                <label for="pauseSecondsSelect">場景間隔停頓 (秒)</label>
                <select id="pauseSecondsSelect" style="width: 100%; padding: 8px; margin-top: 5px; border-radius: 4px; border: 1px solid #ccc; background: rgba(255, 255, 255, 0.9);">
                    <option value="1">1 秒 (預設)</option>
                    <option value="2">2 秒</option>
                    <option value="3">3 秒</option>
                    <option value="4">4 秒</option>
                    <option value="5">5 秒</option>
                </select>
            </div>
            <div class="modal-actions" style="margin-top: 20px;">
                <button class="secondary-btn" id="btnCloseSettings">取消</button>
                <button class="primary-btn" id="btnSaveSettings">儲存</button>
            </div>
        </div>
    </div>

    <!-- Loading Modal -->
    <div class="modal hidden" id="loadingModal">
        <div class="modal-content glass-panel loading-modal">
            <div class="spinner"></div>
            <h2 id="loadingText">AI 導演正在處理中...</h2>
            <p id="loadingSubtext">請稍候</p>
        </div>
    </div>

    <!-- Zoom Modal -->
    <div class="modal hidden" id="zoomModal">
        <div class="modal-content glass-panel" style="width: 800px; max-width: 95vw; height: 80vh; display: flex; flex-direction: column;">
            <h2 id="zoomModalTitle">編輯</h2>
            <textarea id="zoomModalTextarea" class="editor-textarea" style="flex: 1; margin-bottom: 20px; resize: none;"></textarea>
            <div class="modal-actions">
                <button class="secondary-btn" id="btnCloseZoom">取消</button>
                <button class="primary-btn" id="btnSaveZoom">確認更改</button>
            </div>
        </div>
    </div>

    <!-- Success Toast -->
    <div class="toast hidden" id="toast"></div>

    <script src="app.js"></script>
</body>
</html>
